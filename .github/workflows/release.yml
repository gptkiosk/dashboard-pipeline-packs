name: Release packs

# Push a tag such as v2026.11.01 to build every pack, sign the index with the dashboard release key and open a DRAFT release.
# Publishing the draft (after checking it) is the approval: dashboards only read the latest published release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Injection scan and README catalog
        run: |
          python3 -I tools/scan.py
          python3 -I tools/readme.py --check
      - name: Fetch the dashboard whose validator packs must pass
        if: vars.DASHBOARD_REPOSITORY != ''
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/${{ vars.DASHBOARD_REPOSITORY }}.git" "$RUNNER_TEMP/dashboard"
          # The dashboard's validator imports its API modules, so it runs with the dashboard's own locked requirements.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r "$RUNNER_TEMP/dashboard/apps/api/requirements.lock.txt"
      - name: Validate and build
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/dashboard" ]; then
            "$RUNNER_TEMP/venv/bin/python" -I tools/build.py --dashboard "$RUNNER_TEMP/dashboard"
          else
            python3 -I tools/build.py
          fi
          test -f dist/pipeline-packs.json || { echo "No packs to release." >&2; exit 1; }
      - name: Sign the index
        env:
          RELEASE_SSH_PRIVATE_KEY: ${{ secrets.RELEASE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_SSH_PRIVATE_KEY:-}" || { echo "Add the RELEASE_SSH_PRIVATE_KEY secret (the dashboard-release key) to this repository." >&2; exit 1; }
          key="$RUNNER_TEMP/release-signing-key"
          umask 077
          printf '%s\n' "$RELEASE_SSH_PRIVATE_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          ssh-keygen -y -f "$key" >/dev/null
          ssh-keygen -Y sign -f "$key" -n dashboard-release dist/pipeline-packs.json
          ssh-keygen -Y verify -f allowed_signers -I dashboard-release -n dashboard-release -s dist/pipeline-packs.json.sig < dist/pipeline-packs.json
          (cd dist && sha256sum pipeline-packs.json.sig >> SHA256SUMS)
      - name: Open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Pipeline packs in this release:"
            echo
            python3 -I tools/release_notes.py dist/pipeline-packs.json
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "Pipeline packs $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
